<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Calculadoras Portugal 2026{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
<base target="_self">
</head>
<body>
    <header>
        <nav>
            <h1><a href="/">Calculadoras Portugal <span>2026</span></a></h1>
            <ul>
                <li><a href="/salario">Salário</a></li>
                <li><a href="/credito">Crédito</a></li>
                <li><a href="/rescisao">Rescisão</a></li>
                <li><a href="/subsidio">Desemprego</a></li>
            </ul>
        </nav>
    </header>

    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© 2026 Calculadoras Portugal 2026</p>
    <a href="https://www.buymeacoffee.com/ondoreoku" target="_blank" rel="noopener noreferrer" style="display:inline-block; background:#FFDD00; color:#000; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:700; margin-top:10px;">☕ Buy Me a Coffee</a>
        <p><a href="https://www.buymeacoffee.com/ondoreoku" target="_blank" style="color: var(--primary); font-weight: 600;">Apoia este projeto</a></p>
    </footer>

    <!-- Buy Me a Coffee Widget -->
    <button onclick="toggleDarkMode()" style="position:fixed; bottom:20px; right:20px; z-index:1000; background:#2d2d44; color:#fff; border:2px solid #059669; border-radius:50%; width:50px; height:50px; font-size:24px; cursor:pointer; box-shadow:0 4px 6px rgba(0,0,0,0.2);">🌓</button>
    <script>function toggleDarkMode(){document.body.classList.toggle("dark-mode");localStorage.setItem("darkMode",document.body.classList.contains("dark-mode"));}if(localStorage.getItem("darkMode")==="true"){document.body.classList.add("dark-mode");}</script>
</body>
</html>
